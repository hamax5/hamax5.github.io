<script id="csinit" type="text/x-cindyscript">
//KETlib

<script id="cskeytyped" type="text/x-cindyscript">
//Script (CindyScript)
if(key()=="?" % keydownlist()==[32],
  if(!isreal(NumTyped),NumTyped=0);
  if(NumTyped==0,
    DispStr=
     "Figure(1) Parent(2) Parapara(3) Movie(4) Surf(5)";
  );
  if(NumTyped==1,
    DispStr=
     "Shift+ Title(T) Para(P) Slide(S) Digest(D)";
  );
  if(NumTyped==2,
    DispStr="Shift+ Meshlab(M)";
  );
  if(NumTyped==3,
    DispStr=
     "Ch : disp(0) chg(9) N(+,-) add(<) rmv(>)";
  );
  drawtext(mouse().xy,DispStr,size->24);
  NumTyped=mod(NumTyped+1,4);
,
  NumTyped=0;  
);
if(key()=="1",//Mkfigure
  Viewtex();
  kc();
);
if(key()=="2",//Mkparent
  Viewparent();
);
if(key()=="3",//Flipbook(Parapara)
  Flipbook();
);
if(key()=="4",//Texmovie
  Texmovie();
  kc();
);
if(key()=="5",//Surface
  Cheader();
  Cmain();
  kcC();
  if(ChNum>0,
    Ch=[ChNum];
  ,
    Ch=[1];
  );
  ChNum=0;
);
if(key()=="T",//Title
  Maketitle();
);
if(key()=="P",//ParaF
  Parafolder();
);
if(key()=="S",//Slide 
  Mkslides();
);
if(key()=="D",//Digest(Summary)
  Mkslidesummary();
);
if(key()=="M",//Meshlab
  Mkviewobj(OCNAME,OBJCMD,OCOPTION);
);

if(key()=="0",
  Dispchoice();
);
if(key()=="9",
  if(length(Ch)==0,
    Ch=[ChNum];
  ,
    if(!contains(Ch,ChNum),
      Ch=append(Ch,ChNum);
      ChNum=Ch_(length(Ch)-1);
      Ch=remove(Ch,[ChNum]);
      Ch=sort(Ch);
    );
  );
  Dispchoice();
);
if(key()=="+",
  ChNum=ChNum+1;
  Dispchoice();
);
if(key()=="-",
  ChNum=ChNum-1;
  Dispchoice();
);
if(key()=="<",
  if(length(select(Ch,#==ChNum))==0,
    Ch=append(Ch,ChNum);
    Ch=sort(Ch);
    ChNum=ChNum+1;
  );
  Dispchoice();
);
if(key()=="^",
  if(length(Ch)==0,
    Ch=[ChNum];
  ,
    if(!contains(Ch,ChNum),
      Ch=Ch_(1..(length(Ch)-1));
      Ch=append(Ch,ChNum);
      Ch=sort(Ch);
    );
  );
  ChNum=ChNum+1;
  Dispchoice();
);
if(key()=="~",
  if(length(Ch)==0,
    Ch=[ChNum];
  ,
    if(!contains(Ch,ChNum),
      Ch=Ch_(1..(length(Ch)-1));
      Ch=append(Ch,ChNum);
      Ch=sort(Ch);
    );
  );
  ChNum=max(ChNum-1,1);
  Dispchoice();
);
if(key()==">",
  if(length(Ch)>0,
    ChNum=Ch_(length(Ch));
    Ch=Remove(Ch,[ChNum]);
  );
  Dispchoice();
);

;

</script>
<script id="csdraw" type="text/x-cindyscript">
//figures
Ketinit();
Setketcindyjs(["Label=[]","Color=offwhite"]);//no ketjs
//Slider("S",[0,-15],[6,-15],"Thick=1");
//Slider("T",[0,-16],[6,-16],"Thick=1");
Setax([7,"s1e1"]);


f1(x):=x^3-3*x+2;
//Plotdata("1","f1(x)","x=[-5,5]",["dr,3","Color=red","Num=200"]);

A1=[A.x,A.y+5];B1=[B.x,B.y+5];Pointdata("1",B1,["Size=3"]);
C1=[C.x,C.y+5];Pointdata("2",C1,["Size=3"]);
D1=[D.x,D.y+5];E1=[E.x,E.y+5];Pointdata("3",D1,["Size=3"]);
Putpoint("F",[B.x-1,B.y],[F.x,B.y]);
Putpoint("G",[B.x+1,B.y],[G.x,B.y]);
F1=[F.x,F.y+5];G1=[G.x,G.y+5];
Putpoint("H",[D.x-1,D.y],[H.x,D.y]);
Putpoint("K",[D.x+1,D.y],[K.x,D.y]);
H1=[H.x,H.y+5];K1=[K.x,K.y+5];
//Pointdata("1m",B+[0,5]);
//F1=pt1m.xy;

Bezier("1",[A1,B1,C1,D1,E1],[F1,G1,H1,K1],["Num=100","dr,2","Color=blue"]);


if(sgn==1,
  Plotdata("1","f1(x)","x=[-5,5]",["dr,3","Color=blue","Num=200"]);
);


Windispg();

Help("Putpoint");
;

</script>
